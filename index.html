<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasta Vision AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
    <main>
        <h1>Pasta Vision AI</h1>
        <p>Ciao bella! Show me your pasta and I'll name it</p>

        <div id="container">
        <div id="webcam-container">
            <button id="flip-camera-button" style="display: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zM12 18c-2.76 0-5-2.24-5-5H5l2.5-2.5L10 13H8c0 2.21 1.79 4 4 4s4-1.79 4-4-1.79-4-4-4c-.58 0-1.14.13-1.64.36L9.59 8.59C10.33 8.22 11.14 8 12 8c2.76 0 5 2.24 5 5s-2.24 5-5 5z" fill="currentColor"/>
                </svg>
            </button>
        </div>
        <div id="image-container">
            <img id="uploaded-image" src="#" alt="Uploaded Image"/>
        </div>
        <div id="label-container"></div>
        <div id="details-container" style="display: none;">
            <p id="pasta-pronunciation"></p>
            <h3>History</h3>
            <p id="pasta-history"></p>
            <h3>Typical Pairing</h3>
            <p id="pasta-pairing"></p>
            <h3>Meaning</h3>
            <p id="pasta-meaning"></p>
            <h3>Region</h3>
            <p id="pasta-region"></p>
        </div>
    </div>
</main>

    <div id="button-container">
        <button id="webcam-button">Use Camera</button>
        <button id="upload-button">Upload Photo</button>
        <button id="reset-button" style="display: none;">Scan Again</button>
        <input type="file" id="file-upload" accept="image/*" style="display: none;">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
